# Builds the TerraMind Studio Windows desktop app (installer + portable .exe)
name: TerraMind Studio desktop build

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["terramind-studio/**", ".github/workflows/desktop-build.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests
        run: node terramind-studio/tests/run-tests.js

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: terramind-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tools
        run: npm install --no-audit --no-fund
      - name: Build installer and portable exe
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TerraMind-Studio-Windows
          path: |
            terramind-studio/dist/*.exe
          if-no-files-found: error
      - name: Read app version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release with the installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: TerraMind Studio ${{ steps.ver.outputs.v }}
          body: |
            Windows downloads:
            - **TerraMind-Studio-Setup-${{ steps.ver.outputs.v }}.exe** — installer (Start menu + desktop shortcut)
            - **TerraMind-Studio-Portable-${{ steps.ver.outputs.v }}.exe** — runs without installing
            The app is not code-signed: on first run Windows SmartScreen shows a warning — click "More info" → "Run anyway".
          files: terramind-studio/dist/*.exe
          make_latest: true
