# Builds the TerraMind Studio Windows desktop app (installer + portable .exe)
name: TerraMind Studio desktop build

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["terramind-studio/**", ".github/workflows/desktop-build.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests
        run: node terramind-studio/tests/run-tests.js

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: terramind-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tools
        run: npm install --no-audit --no-fund
      - name: Build installer and portable exe
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TerraMind-Studio-Windows
          path: |
            terramind-studio/dist/*.exe
          if-no-files-found: error
      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: terramind-studio/dist/*.exe
