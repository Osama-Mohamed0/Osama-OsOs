# بناء تطبيق إنجاز لويندوز (مثبّت + نسخة محمولة)
name: Build Windows app

on:
  push:
    branches: ['main', 'claude/**']
    tags: ['v*']
    paths-ignore: ['mobile/**', '.github/workflows/build-android.yml']
  workflow_dispatch:

permissions:
  contents: write # لإنشاء إصدار (Release) عند دفع وسم v*

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer and portable exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Injaz-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
