<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TerraMind Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="TerraMind Studio — AI-native mining geology, resource estimation and open-pit planning in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">

  <header class="panel ribbon">
    <div class="rib-top">
      <div class="brand"><div class="brand-mark"><span></span></div>TerraMind Studio <span class="proj" id="projName"></span></div>
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <div class="rib-end">
        <span class="save-state" id="saveState"></span>
        <span class="chip" id="dbChip"><span class="dot"></span><span></span></span>
        <button class="btn-lang" id="langBtn" type="button">العربية</button>
      </div>
    </div>
    <div class="tools" id="tools"></div>
  </header>

  <aside class="panel dock left">
    <div class="dock-scroll">
      <section class="sec">
        <div class="cog">
          <div class="sec-h" style="margin-bottom:2px"><span class="eyebrow" data-en="Cut-off grade" data-ar="حد القطع"></span><span class="chip info" id="visBlocks">—</span></div>
          <div class="cog-val" id="cogVal">0.50</div>
          <input type="range" id="cog" min="0.1" max="3" step="0.05" value="0.5" aria-label="Cut-off grade">
          <div class="cog-scale"><span>0.10</span><span>1.55</span><span>3.00</span></div>
        </div>
      </section>
      <section class="sec">
        <div class="sec-h"><span class="eyebrow" data-en="Layers" data-ar="الطبقات"></span></div>
        <div id="layerTree"></div>
      </section>
      <section class="sec insp">
        <div class="sec-h"><span class="eyebrow" data-en="Object inspector" data-ar="فاحص العناصر"></span></div>
        <div id="inspector"></div>
      </section>
    </div>
  </aside>

  <main class="panel view" id="view">
    <canvas id="gl"></canvas>
    <div class="labels" id="labels"></div>
    <div class="hud hud-tl">
      <div class="hud-card"><div class="hud-k" data-en="Cursor" data-ar="المؤشر"></div><div class="mono" id="hudXYZ">E —  N —  RL —</div><div class="mono" id="hudHit" style="color:var(--fg-2)"></div></div>
      <div class="hud-card"><div class="hud-k" data-en="Section" data-ar="المقطع"></div><div class="mono" id="hudSlice">off</div></div>
    </div>
    <div class="views"><button type="button" data-view="top">PLAN</button><button type="button" data-view="north">N</button><button type="button" data-view="east">E</button><button type="button" data-view="south">S</button><button type="button" data-view="west">W</button><button type="button" data-view="iso">3D</button></div>
    <div class="hud hud-card legend" id="legend"></div>
    <canvas class="hud gizmo" id="gizmo" width="168" height="168"></canvas>
    <div class="slicer" id="slicer">
      <label class="toggle"><input type="checkbox" id="slOn"><span data-en="Section" data-ar="المقطع"></span></label>
      <div class="seg" id="slAxis"><button type="button" data-ax="x" aria-pressed="true">E</button><button type="button" data-ax="y" aria-pressed="false">N</button><button type="button" data-ax="z" aria-pressed="false">RL</button></div>
      <input type="range" id="slPos" min="0" max="100" step="1" value="50" aria-label="Section position">
      <output id="slVal">—</output>
      <label class="toggle"><span data-en="Slab m" data-ar="سماكة م"></span><input type="number" id="slThick" min="0" step="5" value="0" aria-label="Slab thickness"></label>
    </div>
    <div class="progress" id="progress" hidden><span></span><b><i></i></b></div>
    <div class="loading" id="loading">Loading TerraMind Studio…</div>
  </main>

  <section class="panel kpis" id="kpis"></section>

  <aside class="panel dock right">
    <div class="cp-head"><i data-lucide="sparkles"></i><h2 data-en="AI Copilot" data-ar="المساعد الذكي"></h2><button class="chip warn" id="engineChip" type="button" style="margin-inline-start:auto"><span class="dot"></span><span id="engineTxt"></span></button></div>
    <div class="dock-scroll" style="display:flex;flex-direction:column">
      <section class="sec">
        <div class="sec-h"><span class="eyebrow" data-en="Decision support" data-ar="دعم القرار"></span><span class="badge" id="alertCount"></span></div>
        <div class="cards" id="cards"></div>
      </section>
      <section class="sec" style="padding-block:8px">
        <button class="report-btn" id="reportBtn" type="button"><i data-lucide="file-text"></i><span data-en="Executive report" data-ar="التقرير التنفيذي"></span></button>
      </section>
      <section class="chat">
        <div class="msgs" id="msgs" aria-live="polite"></div>
        <div class="suggest" id="suggest"></div>
        <form class="composer" id="composer">
          <textarea id="prompt" dir="auto" rows="1" aria-label="Command"></textarea>
          <button type="submit" aria-label="Send"><i data-lucide="send"></i></button>
        </form>
      </section>
    </div>
  </aside>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="sheet-h"><h2 id="modalTitle"></h2><span class="sheet-a" id="modalActions"></span><button class="icon-btn" id="modalClose" type="button" aria-label="Close"><i data-lucide="x"></i></button></div>
    <div class="sheet-b" id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div id="printArea"></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/lucide.min.js"></script>
<script src="vendor/delaunator.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/00-core.js"></script>
<script src="js/10-project.js"></script>
<script src="js/20-io.js"></script>
<script src="js/30-drillholes.js"></script>
<script src="js/35-surfaces.js"></script>
<script src="js/40-estimation.js"></script>
<script src="js/45-implicit.js"></script>
<script src="js/47-solidops.js"></script>
<script src="js/50-mining.js"></script>
<script src="js/52-design.js"></script>
<script src="js/55-workflow.js"></script>
<script src="js/57-blast.js"></script>
<script src="js/60-viewport.js"></script>
<script src="js/62-cad.js"></script>
<script src="js/70-ui.js"></script>
<script src="js/75-plot.js"></script>
<script src="js/80-ai.js"></script>
<script src="js/85-report.js"></script>
<script src="js/90-app.js"></script>
<script>TM.UI.icons(); TM.App.boot();</script>
</body>
</html>
