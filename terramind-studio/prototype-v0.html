<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TerraMind Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: 5-zone CAD workspace — workflow ribbon / layers dock / 3D viewport / AI copilot dock / live KPI strip.
   Single dark CAD theme by design (user-specified palette). */
:root{
  --bg:#0B0F19; --panel:#111827; --panel-2:#0E1421; --raise:#172033;
  --line:#1F2937; --line-2:#2B3648;
  --fg:#E6EAF1; --fg-2:#A7B1C2; --muted:#6F7A8E;
  --em:#10B981; --em-ink:#34D399; --em-soft:rgba(16,185,129,.13);
  --blue:#3B82F6; --blue-ink:#7AA9F8; --blue-soft:rgba(59,130,246,.14);
  --series-a:#3B82F6; --series-b:#12A877;
  --warn:#F59E0B; --warn-soft:rgba(245,158,11,.13);
  --crit:#F87171; --crit-soft:rgba(248,113,113,.12);
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
  --f-cond:"IBM Plex Sans Condensed","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
html[lang=ar] body{font-family:var(--f-ar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;gap:8px;
  grid-template-columns:272px minmax(0,1fr) 360px;
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"rib rib rib" "left view right" "left kpi right";
  padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0;min-height:0}

/* ---------- Zone 1: ribbon ---------- */
.ribbon{grid-area:rib;display:flex;flex-direction:column}
.rib-top{display:flex;align-items:center;gap:12px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-cond);font-weight:600;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.brand-mark{width:22px;height:22px;border-radius:5px;background:conic-gradient(from 210deg,var(--em),var(--blue),var(--em));display:grid;place-items:center}
.brand-mark span{width:10px;height:10px;background:var(--panel);clip-path:polygon(50% 0,100% 100%,0 100%)}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1 1 auto;min-width:0;scrollbar-width:none}
.tab{background:none;border:0;border-radius:5px;padding:6px 10px;color:var(--fg-2);font-family:var(--f-cond);font-weight:500;font-size:12.5px;letter-spacing:.02em;white-space:nowrap}
.tab:hover{background:var(--raise);color:var(--fg)}
.tab[aria-selected=true]{background:var(--blue-soft);color:var(--blue-ink)}
.rib-end{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line-2);color:var(--fg-2);white-space:nowrap}
.chip.ok{color:var(--em-ink);border-color:rgba(16,185,129,.35);background:var(--em-soft)}
.chip.warn{color:var(--warn);border-color:rgba(245,158,11,.35);background:var(--warn-soft)}
.chip.crit{color:var(--crit);border-color:rgba(248,113,113,.35);background:var(--crit-soft)}
.chip.info{color:var(--blue-ink);border-color:rgba(59,130,246,.35);background:var(--blue-soft)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.sel{background:var(--panel-2);border:1px solid var(--line-2);border-radius:5px;padding:4px 6px;font-size:12px}
.tools{display:flex;gap:4px;padding:6px 8px;overflow-x:auto;scrollbar-width:thin}
.tool{display:flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:6px 10px;font-size:12px;white-space:nowrap;color:var(--fg)}
.tool:hover{border-color:var(--line-2);background:var(--raise)}
.tool[aria-pressed=true]{border-color:rgba(16,185,129,.5);background:var(--em-soft);color:var(--em-ink)}
.tool svg{width:15px;height:15px;color:var(--fg-2)}
.tool[aria-pressed=true] svg{color:var(--em-ink)}
.tool-sep{width:1px;background:var(--line);margin:2px 4px;flex:0 0 auto}
.btn-lang{background:var(--panel-2);border:1px solid var(--line-2);border-radius:5px;padding:4px 8px;font-size:12px}

/* ---------- docks ---------- */
.dock{display:flex;flex-direction:column;overflow:hidden}
.left{grid-area:left}
.right{grid-area:right}
.dock-scroll{overflow:auto;min-height:0;flex:1 1 auto}
.sec{padding:10px 12px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.eyebrow{font-family:var(--f-cond);font-weight:600;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
html[lang=ar] .eyebrow{letter-spacing:0;font-size:12px}
.layer{border:1px solid var(--line);border-radius:5px;margin-bottom:6px;background:var(--panel-2)}
.layer-row{display:flex;align-items:center;gap:6px;padding:6px 6px}
.eye{background:none;border:0;padding:3px;border-radius:4px;color:var(--fg-2);display:grid;place-items:center}
.eye:hover{background:var(--raise)}
.eye svg{width:15px;height:15px}
.layer.off .layer-name{color:var(--muted)}
.layer-name{font-family:var(--f-mono);font-size:12px;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;text-align:start;padding:0}
.swatch{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.badge{font-family:var(--f-mono);font-size:10.5px;color:var(--fg-2);white-space:nowrap}
.layer-body{padding:2px 8px 8px 30px;display:grid;gap:6px}
html[dir=rtl] .layer-body{padding:2px 30px 8px 8px}
.ctl{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:center;gap:8px;font-size:11.5px;color:var(--fg-2)}
.ctl output{font-family:var(--f-mono);font-size:11px;color:var(--fg);min-width:40px;text-align:end}
input[type=range]{width:100%;accent-color:var(--em);height:16px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:5px;overflow:hidden}
.seg button{background:none;border:0;padding:3px 9px;font-size:11.5px;color:var(--fg-2)}
.seg button[aria-pressed=true]{background:var(--blue-soft);color:var(--blue-ink)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-2)}
.toggle input{accent-color:var(--em)}
.cog{background:linear-gradient(180deg,rgba(16,185,129,.08),transparent);border:1px solid rgba(16,185,129,.28);border-radius:6px;padding:10px}
.cog-val{font-family:var(--f-mono);font-size:22px;font-weight:500;color:var(--em-ink)}
.cog-val small{font-size:12px;color:var(--fg-2);font-weight:400}
.cog-scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.field{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:11.5px;color:var(--fg-2);margin-bottom:6px}
.field input{background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;padding:4px 6px;font-family:var(--f-mono);font-size:12px;width:100%;text-align:end}
.insp{font-size:12px}
.insp dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin:0}
.insp dt{color:var(--muted)}
.insp dd{margin:0;font-family:var(--f-mono);text-align:end}
.hint{color:var(--muted);font-size:11.5px;margin:0}

/* ---------- Zone 3: viewport ---------- */
.view{grid-area:view;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#131b2c 0%,#0B0F19 70%)}
#gl{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;pointer-events:none;font-size:11px}
.hud-tl{top:10px;inset-inline-start:10px;display:grid;gap:4px}
.hud-card{background:rgba(11,15,25,.78);border:1px solid var(--line-2);border-radius:5px;padding:6px 8px;backdrop-filter:blur(4px)}
.hud-card .mono{font-size:11px}
.hud-k{color:var(--muted);font-family:var(--f-cond);letter-spacing:.06em;text-transform:uppercase;font-size:10px}
.legend{top:10px;inset-inline-end:10px;width:172px}
.legend canvas{width:100%;height:10px;display:block;border-radius:2px;margin-top:5px}
.legend .ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--fg-2);margin-top:3px}
.lith-key{display:grid;grid-template-columns:auto 1fr;gap:3px 6px;margin-top:5px;align-items:center}
.gizmo{bottom:10px;inset-inline-end:10px;width:84px;height:84px}
.slicer{position:absolute;bottom:10px;inset-inline-start:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:calc(100% - 120px);background:rgba(11,15,25,.82);border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;font-size:11.5px}
.slicer input[type=range]{width:150px}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-130%);font-family:var(--f-mono);font-size:10px;color:var(--fg);background:rgba(11,15,25,.72);border:1px solid var(--line-2);padding:0 4px;border-radius:3px;white-space:nowrap}
.lbl.ph{color:#67E8F9;border-color:rgba(103,232,249,.45)}
.lbl.flag{color:var(--crit);border-color:rgba(248,113,113,.5)}
.toast{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);background:var(--raise);border:1px solid var(--line-2);border-radius:6px;padding:7px 12px;font-size:12px;max-width:min(520px,calc(100% - 24px));box-shadow:0 8px 24px rgba(0,0,0,.4);transition:opacity .2s}
.view.sketching #gl{cursor:crosshair}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--fg-2);font-family:var(--f-mono);font-size:12px}

/* ---------- Zone 4: KPI bar ---------- */
.kpis{grid-area:kpi;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;overflow:hidden}
.kpi{padding:9px 12px;border-inline-end:1px solid var(--line);min-width:0}
.kpi:last-child{border-inline-end:0}
.kpi-k{font-family:var(--f-cond);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang=ar] .kpi-k{letter-spacing:0;font-size:12px}
.kpi-v{font-family:var(--f-mono);font-size:19px;font-weight:500;margin-top:2px;white-space:nowrap}
.kpi-v small{font-size:11px;color:var(--fg-2);font-weight:400}
.kpi-s{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.delta-up{color:var(--em-ink)} .delta-dn{color:var(--crit)}
.kpi.hero .kpi-v{color:var(--em-ink)}
.kpi.neg .kpi-v{color:var(--crit)}

/* ---------- Zone 5: copilot ---------- */
.cp-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.cp-head h2{margin:0;font-family:var(--f-cond);font-size:14px;font-weight:600;letter-spacing:.02em}
.cp-head svg{width:16px;height:16px;color:var(--em-ink)}
.cards{display:grid;gap:8px}
.card{border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:var(--panel-2);display:grid;gap:6px}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.card p{margin:0;font-size:12px;color:var(--fg)}
.card .sub{font-size:11px;color:var(--fg-2)}
.card.done{opacity:.72}
.act{justify-self:start;display:inline-flex;align-items:center;gap:6px;background:var(--em);color:#04150F;border:0;border-radius:5px;padding:5px 10px;font-weight:600;font-size:12px}
.act:hover{filter:brightness(1.08)}
.act.blue{background:var(--blue);color:#fff}
.act:disabled{background:var(--raise);color:var(--fg-2);cursor:default;filter:none}
.act svg{width:14px;height:14px}
.chat{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.msgs{flex:1 1 auto;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.msg{max-width:92%;padding:7px 10px;border-radius:8px;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--blue-soft);border:1px solid rgba(59,130,246,.3)}
.msg.bot{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line)}
.msg.bot b{color:var(--em-ink);font-weight:500}
.call{font-family:var(--f-mono);font-size:11px;background:#0A0E17;border:1px solid var(--line-2);border-radius:5px;padding:6px 8px;margin:4px 0;white-space:pre-wrap;color:var(--blue-ink);direction:ltr;text-align:left}
.call .fn{color:var(--em-ink)}
.suggest{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}
.sg{background:none;border:1px dashed var(--line-2);border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--fg-2);text-align:start}
.sg:hover{border-color:var(--blue);color:var(--fg)}
.composer{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.composer textarea{flex:1 1 auto;min-width:0;resize:none;background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;font-size:12.5px;height:38px}
.composer button{background:var(--blue);border:0;border-radius:6px;color:#fff;width:38px;display:grid;place-items:center}
.composer button svg{width:16px;height:16px}
html[dir=rtl] .composer button svg{transform:scaleX(-1)}
.report-btn{width:100%;justify-content:center;display:flex;align-items:center;gap:8px;background:var(--raise);border:1px solid var(--line-2);border-radius:6px;padding:8px;font-weight:500}
.report-btn:hover{border-color:var(--em)}
.report-btn svg{width:15px;height:15px;color:var(--em-ink)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(3,6,12,.72);display:grid;place-items:center;z-index:50;padding-block:max(16px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--panel);border:1px solid var(--line-2);border-radius:8px;width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet-h h2{margin:0;font-family:var(--f-cond);font-size:16px;font-weight:600;flex:1 1 auto;text-wrap:balance}
.sheet-b{overflow:auto;padding:16px 20px 24px}
.icon-btn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:5px;padding:5px 10px;display:inline-flex;gap:6px;align-items:center;font-size:12px}
.icon-btn svg{width:14px;height:14px}
.rpt h3{font-family:var(--f-cond);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--em-ink);margin:22px 0 8px;font-weight:600}
html[lang=ar] .rpt h3{letter-spacing:0;font-size:14px}
.rpt h3:first-child{margin-top:0}
.rpt p{max-width:72ch;margin:0 0 8px;color:var(--fg);line-height:1.6}
.rpt .meta{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-bottom:14px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:end;white-space:nowrap}
th{font-family:var(--f-cond);font-weight:500;color:var(--fg-2);background:var(--panel-2);font-size:11.5px}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:start}
tr.cur td{background:var(--em-soft)}
tr:last-child td{border-bottom:0}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kbox{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel-2)}
.kbox .kpi-v{font-size:16px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.chart{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--panel-2);position:relative;min-width:0}
.chart h4{margin:0 0 4px;font-size:12px;font-weight:500;color:var(--fg)}
.chart svg{width:100%;height:auto;display:block}
.chart-legend{display:flex;gap:12px;font-size:11px;color:var(--fg-2);margin-bottom:4px}
.chart-legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-inline-end:5px}
.tip{position:absolute;pointer-events:none;background:var(--raise);border:1px solid var(--line-2);border-radius:5px;padding:5px 8px;font-size:11px;font-family:var(--f-mono);white-space:nowrap;z-index:2}
.qa{display:grid;gap:6px}
.qa-row{display:flex;gap:8px;align-items:flex-start}
.recs{margin:0;padding-inline-start:20px;display:grid;gap:5px;max-width:78ch}
pre.json{font-family:var(--f-mono);font-size:11.5px;background:#0A0E17;border:1px solid var(--line-2);border-radius:6px;padding:12px;overflow:auto;max-height:60vh;direction:ltr;text-align:left;margin:0}

/* ---------- responsive ---------- */
@media (max-width:1280px){ .app{grid-template-columns:240px minmax(0,1fr) 320px} .kpi-v{font-size:16px} }
@media (max-width:1000px){
  html,body{height:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"rib" "view" "kpi" "right" "left"}
  .view{height:62vh;min-height:380px}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi:nth-child(3n){border-inline-end:0}
  .kpi:nth-child(-n+3){border-bottom:1px solid var(--line)}
  .dock{overflow:visible} .dock-scroll{overflow:visible}
  .msgs{max-height:420px}
}
@media (max-width:560px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3n){border-inline-end:1px solid var(--line)}
  .kpi:nth-child(2n){border-inline-end:0}
  .kpi:nth-child(-n+4){border-bottom:1px solid var(--line)}
  .legend{width:132px}
  .slicer{max-width:calc(100% - 20px);bottom:100px}
  .slicer input[type=range]{width:110px}
  .rib-end{margin-inline-start:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- Zone 1: Workflow ribbon -->
  <header class="panel ribbon">
    <div class="rib-top">
      <div class="brand"><div class="brand-mark"><span></span></div>TerraMind Studio <small>Wadi Gold · demo.tmd</small></div>
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <div class="rib-end">
        <span class="chip ok" id="dbChip"><span class="dot"></span><span data-i18n="dbOk"></span></span>
        <button class="btn-lang" id="langBtn" type="button">العربية</button>
      </div>
    </div>
    <div class="tools" id="tools"></div>
  </header>

  <!-- Zone 2: Layers + inspector -->
  <aside class="panel dock left">
    <div class="dock-scroll">
      <section class="sec">
        <div class="cog">
          <div class="sec-h" style="margin-bottom:2px"><span class="eyebrow" data-i18n="cutoff"></span><span class="chip info mono" id="visBlocks">–</span></div>
          <div class="cog-val" id="cogVal">0.50 <small>g/t Au</small></div>

    <p>${ar ? `عند حد قطع ${fmt(S.cutoff, 2)} غ/طن، تحتوي الحفرة المحسّنة (ميل ${fmt(S.pit.slope)}°، القاع عند المنسوب ${fmt(S.pit.zb)} م) على <b>${fmt(k.oreT / 1e6, 2)} مليون طن</b> من الخام بتركيز <b>${fmt(k.grade, 2)} غ/طن</b>، أي ${fmt(k.oz / 1e3, 1)} ألف أونصة ذهب، مع ${fmt(k.wasteT / 1e6, 2)} مليون طن نفايات (نسبة كشف ${fmt(sr, 2)}). صافي القيمة الحالية بخصم 8% هو <b>${usd(k.npv / 1e6)} مليون</b> عند سعر $${fmt(S.price)}/أونصة وعمر منجم ${fmt(k.life, 1)} سنة.` : `At a ${fmt(S.cutoff, 2)} g/t cut-off, the optimised pit (${fmt(S.pit.slope)}° overall slope, floor at RL ${fmt(S.pit.zb)}) contains <b>${fmt(k.oreT / 1e6, 2)} Mt</b> of ore at <b>${fmt(k.grade, 2)} g/t Au</b> for ${fmt(k.oz / 1e3, 1)} koz contained, with ${fmt(k.wasteT / 1e6, 2)} Mt of waste (SR ${fmt(sr, 2)}). NPV at 8% is <b>${usd(k.npv / 1e6)}M</b> at $${fmt(S.price)}/oz over a ${fmt(k.life, 1)}-year life.`}</p>
    <div class="kgrid">${[[t('k_ore'), fmt(k.oreT / 1e6, 2) + ' Mt'], [t('k_grade'), fmt(k.grade, 2) + ' g/t'], [t('k_metal'), fmt(k.oz / 1e3, 1) + ' koz'], [t('k_sr'), fmt(sr, 2)], [t('k_npv'), usd(k.npv / 1e6) + 'M']].map(([a, b]) => `<div class="kbox"><div class="kpi-k">${a}</div><div class="kpi-v">${b}</div></div>`).join('')}</div>
    <h3>${ar ? 'حالة ضبط الجودة QA/QC' : 'QA/QC status'}</h3>
    <div class="qa">${qa.map(([c, x]) => `<div class="qa-row"><span class="chip ${c}"><span class="dot"></span>${c === 'ok' ? 'PASS' : c === 'warn' ? 'CHECK' : 'FLAG'}</span><span>${x}</span></div>`).join('')}</div>
    <h3>${ar ? 'منحنى وجدول التركيز-الحمولة' : 'Grade-tonnage'}</h3>
    ${chartsHTML(ar)}
    <div style="height:10px"></div>${gtTable(ar)}
    <p class="hint" style="margin-top:6px">${ar ? `نموذج IDW (أس ${S.idwPower})، بلوكات ${BM.bs} م، نصف قطر بحث ${S.searchR} م، كثافة ${S.density}.` : `IDW power ${S.idwPower}, ${BM.bs} m blocks, ${S.searchR} m search, SG ${S.density}. Highlighted row = active cut-off.`}</p>
    <h3>${ar ? 'اقتصاديات الحفرة' : 'Pit economics'}</h3>
    <div class="tbl-wrap"><table><tbody>
      <tr><td>${ar ? 'الإيراد (بعد الاستخلاص)' : 'Revenue (recovered)'}</td><td>$${fmt(k.rev / 1e6, 1)}M</td></tr>
      <tr><td>${ar ? 'تكاليف التعدين والمعالجة' : 'Mining + processing cost'}</td><td>$${fmt(k.cost / 1e6, 1)}M</td></tr>
      <tr><td>${ar ? 'التدفق النقدي غير المخصوم' : 'Undiscounted cashflow'}</td><td>${usd(k.cash / 1e6)}M</td></tr>
      <tr><td>${ar ? 'رأس المال' : 'Capex'}</td><td>$${fmt(S.capex / 1e6, 0)}M</td></tr>
      <tr><td>${ar ? 'صافي القيمة الحالية 8%' : 'NPV @ 8%'}</td><td>${usd(k.npv / 1e6)}M</td></tr>
      <tr><td>${ar ? 'الافتراضات' : 'Inputs'}</td><td>$${fmt(S.price)}/oz · ${fmt(S.mineCost, 2)} $/t mined · ${fmt(S.procCost, 1)} $/t milled · ${S.recovery}% rec.</td></tr>
    </tbody></table></div>
    ${sens ? `<h3>${ar ? 'تحليل الحساسية' : 'Sensitivity'}</h3>${sensitivity(ar)}` : ''}
    <h3>${ar ? 'توصيات الذكاء الاصطناعي' : 'AI recommendations'}</h3>
    <ol class="recs">${recs.map(r => `<li>${esc(r)}</li>`).join('')}</ol>
  </div>`;
  REPORT_MD = `# ${name} — ${ar ? 'التقرير التنفيذي' : 'Executive Engineering & Reserve Report'}\n_${date} · synthetic data_\n\n## Summary\n- Cut-off: ${fmt(S.cutoff, 2)} g/t Au\n- Ore: ${fmt(k.oreT / 1e6, 2)} Mt @ ${fmt(k.grade, 2)} g/t (${fmt(k.oz / 1e3, 1)} koz)\n- Waste: ${fmt(k.wasteT / 1e6, 2)} Mt · SR ${fmt(sr, 2)}\n- NPV@8%: ${usd(k.npv / 1e6)}M · life ${fmt(k.life, 1)} yr\n- Pit: ${fmt(S.pit.slope)}° slope, floor RL ${fmt(S.pit.zb)}\n\n## QA/QC\n${qa.map(q => '- ' + q[1]).join('\n')}\n\n## Recommendations\n${recs.map((r, i) => `${i + 1}. ${r}`).join('\n')}\n`;
  openModal(ar ? 'التقرير التنفيذي الهندسي والاحتياطي' : 'Executive Engineering & Reserve Report', html, [{ label: ar ? 'نسخ Markdown' : 'Copy as Markdown', icon: 'copy', fn: () => copyText(REPORT_MD) }]);
}
function showGT() { const ar = S.lang === 'ar'; openModal(t('gt'), `<div class="rpt">${chartsHTML(ar)}<div style="height:10px"></div>${gtTable(ar)}</div>`); }
function showSchemas() { openModal(t('schemas'), `<p class="hint" style="margin-bottom:10px">${S.lang === 'ar' ? 'نفس المخطط يُرسل إلى Gemini وClaude وOpenAI. في هذا النموذج الأولي يحوّل المحلل المحلي النص إلى هذه الاستدعاءات.' : 'The same JSON schemas are sent to Gemini, Claude and OpenAI function calling. In this prototype a local bilingual parser produces the calls.'}</p><pre class="json">${esc(JSON.stringify(TOOLS, null, 2))}</pre>`, [{ label: 'Copy JSON', icon: 'copy', fn: () => copyText(JSON.stringify(TOOLS, null, 2)) }]); }
function projectJSON() { return JSON.stringify({ format: 'TerraMind.tmd', version: 1, project: 'Wadi Gold', crs: 'local grid (m)', params: { cutoff: S.cutoff, colormap: S.colormap, price: S.price, mineCost: S.mineCost, procCost: S.procCost, recovery: S.recovery, slope: S.slope, benchH: S.benchH, topCut: S.topCut, idwPower: S.idwPower, blockSize: S.blockSize }, pit: S.pit, collars: HOLES.map(h => ({ id: h.id, e: +h.collar[0].toFixed(2), n: +h.collar[1].toFixed(2), z: +h.collar[2].toFixed(2), az: +h.az.toFixed(1), dip: +h.dip.toFixed(1), depth: h.len })), assays: HOLES.reduce((a, h) => a + h.samples.length, 0) + ' rows (stored as table `assays`)', tables: ['collars', 'surveys', 'assays', 'lithology', 'blocks', 'strings', 'wireframes', 'ai_log'] }, null, 2); }
function showProjectFile() {
  const ar = S.lang === 'ar', js = projectJSON();
  openModal(t('save'), `<p class="hint" style="margin-bottom:10px">${ar ? 'ملف ‎.tmd واحد (DuckDB في نسخة سطح المكتب) يجمع كل الجداول. هذا هو البيان (manifest) للمشروع الحالي.' : 'One .tmd file (DuckDB in the desktop build) holds every table. This is the manifest of the current project.'}</p><pre class="json">${esc(js)}</pre>`, [{ label: ar ? 'نسخ' : 'Copy', icon: 'copy', fn: () => copyText(js) }, { label: ar ? 'تنزيل' : 'Download', icon: 'save', fn: () => { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([js], { type: 'application/json' })); a.download = 'wadi-gold.tmd.json'; a.click(); } catch (e) { toast('Download blocked here; use Copy.'); } } }]);
}
function openModal(title, html, actions = []) {
  $('#modalTitle').textContent = title; $('#modalBody').innerHTML = html;
  $('#modalActions').innerHTML = actions.map((a, i) => `<button class="icon-btn" type="button" data-ma="${i}"><i data-lucide="${a.icon}"></i>${a.label}</button>`).join('');
  $('#modalActions').querySelectorAll('[data-ma]').forEach(b => b.onclick = () => actions[+b.dataset.ma].fn());
  $('#modal').hidden = false; icons(); bindChartHover($('#modalBody')); $('#modalClose').focus();
}
function closeModal() { $('#modal').hidden = true; }
function copyText(s) { const ok = () => toast(S.lang === 'ar' ? 'تم النسخ' : 'Copied'); try { navigator.clipboard.writeText(s).then(ok, () => fallbackCopy(s)); } catch (e) { fallbackCopy(s); } }
function fallbackCopy(s) { const pre = $('#modalBody pre') || $('#modalBody'); const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast(S.lang === 'ar' ? 'النص محدد، اضغط Ctrl+C' : 'Text selected — press Ctrl+C'); }

// ---------------------------------------------------------------- CSV import
function importCSV(text) {
  const lines = text.trim().split(/\r?\n/); const hdr = lines.shift().toLowerCase().split(',').map(s => s.trim());
  const ix = n => hdr.findIndex(h => h === n || h.startsWith(n)); const I = { id: ix('hole'), e: ix('east'), n: ix('north'), z: ix('elev'), az: ix('azi'), dip: ix('dip'), f: ix('from'), t: ix('to'), au: ix('au') };
  if (Object.values(I).some(v => v < 0)) throw new Error('Missing columns. Expected hole_id,east,north,elev,azimuth,dip,from,to,au_gpt');
  const map = new Map();
  for (const ln of lines) { const c = ln.split(','); if (c.length < hdr.length) continue; const id = c[I.id].trim(); let h = map.get(id); if (!h) { const az = +c[I.az], dip = Math.abs(+c[I.dip]); h = { id, collar: [+c[I.e], +c[I.n], +c[I.z]], az, dip, dir: dirOf(az, dip), samples: [], len: 0 }; map.set(id, h); } h.samples.push({ from: +c[I.f], to: +c[I.t], au: +c[I.au], lith: 'GD' }); h.len = Math.max(h.len, +c[I.t]); }
  HOLES = [...map.values()]; HOLES.forEach(h => { h.samples.sort((a, b) => a.from - b.from); placeSamples(h); h.samples.forEach(s => s.lith = lithAt(s.x, s.y, s.z)); });
  S.topCut = null; S.overlapsFixed = false; S.infill = []; S.applied = {}; S.pit = null; buildInfill(); buildDrillholes(); rebuildModel(); renderDB();
  return HOLES.length;
}
function renderDB() { const iss = holeIssues(); const bad = iss.overlaps + iss.dups > 0 || !S.topCut; const c = $('#dbChip'); c.className = 'chip ' + (bad ? 'warn' : 'ok'); c.querySelector('span:last-child').textContent = bad ? t('dbWarn') : t('dbOk'); }

// ---------------------------------------------------------------- misc UI
let toastT = 0; function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3600); }
function syncEconInputs() { $('#inPrice').value = S.price; $('#inMine').value = S.mineCost; $('#inProc').value = S.procCost; $('#inRec').value = S.recovery; }
function applyLang() {
  const ar = S.lang === 'ar'; document.documentElement.lang = S.lang; document.documentElement.dir = ar ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  $('#langBtn').textContent = ar ? 'English' : 'العربية'; $('#prompt').placeholder = t('prompt'); $('#loading').textContent = t('loading');
  renderRibbon(); renderEngine(); renderSuggest(); if (BM) { layerTree(); updateKPIs(); renderCards(); renderLegend(); applySlice(); renderDB(); }
}
function inspect(html) { $('#inspector').innerHTML = html; }
function inspectBlock(b) { const ar = S.lang === 'ar'; const inP = PE.inPit[b], ore = BM.bg[b] >= S.cutoff; inspect(`<dl><dt>Object</dt><dd>Block #${b}</dd><dt>E / N / RL</dt><dd>${fmt(BM.bx[b], 1)} / ${fmt(BM.by[b], 1)} / ${fmt(BM.bz[b], 1)}</dd><dt>Au (IDW)</dt><dd>${fmt(BM.bg[b], 3)} g/t</dd><dt>${ar ? 'الحمولة' : 'Tonnes'}</dt><dd>${fmt(BM.blockT)} t</dd><dt>${ar ? 'أقرب عينة' : 'Nearest sample'}</dt><dd>${fmt(BM.bnear[b], 1)} m</dd><dt>${ar ? 'التصنيف' : 'Class'}</dt><dd style="color:${inP && ore ? 'var(--em-ink)' : 'var(--fg-2)'}">${inP ? (ore ? (ar ? 'خام داخل الحفرة' : 'Ore · in pit') : (ar ? 'نفايات داخل الحفرة' : 'Waste · in pit')) : (ar ? 'خارج الحفرة' : 'Outside pit')}</dd></dl>`); }
function inspectSample(h, s) { const ar = S.lang === 'ar'; inspect(`<dl><dt>Hole</dt><dd>${h.id}</dd><dt>${ar ? 'الفترة' : 'Interval'}</dt><dd>${fmt(s.from, 1)}–${fmt(s.to, 1)} m</dd><dt>Au raw</dt><dd style="color:${s.au > 15 ? 'var(--crit)' : 'inherit'}">${fmt(s.au, 2)} g/t</dd>${S.topCut && s.au > S.topCut ? `<dt>Au capped</dt><dd>${fmt(S.topCut, 2)} g/t</dd>` : ''}<dt>${ar ? 'الصخارة' : 'Lithology'}</dt><dd>${s.lith} · ${LITH[s.lith][S.lang]}</dd><dt>Collar</dt><dd>E${fmt(h.collar[0])} N${fmt(h.collar[1])} RL${fmt(h.collar[2])}</dd><dt>Az / Dip</dt><dd>${fmt(h.az, 1)}° / −${fmt(h.dip, 1)}°</dd><dt>${ar ? 'العمق' : 'Depth'}</dt><dd>${fmt(h.len)} m</dd></dl>`); }

// pointer: hover HUD, click inspect / sketch
const mouse = new THREE.Vector2(); let hoverPending = false, downAt = null;
function pick(ev, objs) { const r = $('#gl').getBoundingClientRect(); mouse.set((ev.clientX - r.left) / r.width * 2 - 1, -(ev.clientY - r.top) / r.height * 2 + 1); raycaster.setFromCamera(mouse, camera); return raycaster.intersectObjects(objs.filter(o => o && o.visible !== false), false).filter(h => passesClip(h.point)); }
function bindPointer() {
  const cv = $('#gl');
  cv.addEventListener('pointermove', ev => { if (hoverPending) return; hoverPending = true; requestAnimationFrame(() => { hoverPending = false; const objs = [S.layers.bm.vis && G.bm, S.layers.topo.vis && G.topoSolid].filter(Boolean); if (!S.layers.topo.vis) objs.push(G.topoSolid); const hit = pick(ev, objs)[0]; if (!hit) { $('#hudXYZ').textContent = 'E —  N —  Z —'; $('#hudHit').textContent = ''; return; } const p = toENZ(hit.point); $('#hudXYZ').textContent = `E ${fmt(p.e, 1)}  N ${fmt(p.n, 1)}  Z ${fmt(p.z, 1)}`; if (hit.object === G.bm && hit.instanceId != null) { const b = G.bmVisible[hit.instanceId]; $('#hudHit').textContent = `block · ${fmt(BM.bg[b], 2)} g/t Au`; } else $('#hudHit').textContent = 'topography'; }); });
  cv.addEventListener('pointerdown', ev => downAt = [ev.clientX, ev.clientY]);
  cv.addEventListener('pointerup', ev => {
    if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 4) return;
    if (S.sketch.on) { const hit = pick(ev, [G.topoSolid])[0]; if (hit) { const p = toENZ(hit.point); S.sketch.pts.push([p.e, p.n]); buildSketch(); toast(`${S.sketch.pts.length} ${S.lang === 'ar' ? 'نقطة' : 'vertices'} · E${fmt(p.e)} N${fmt(p.n)}`); } return; }
    const hits = pick(ev, [S.layers.bm.vis && G.bm, S.layers.dh.vis && G.dhMesh, G.topoSolid].filter(Boolean)); const h = hits[0]; if (!h) return;
    if (h.object === G.bm) inspectBlock(G.bmVisible[h.instanceId]); else if (h.object === G.dhMesh) { const [hh, s] = G.dhIndex[h.instanceId]; inspectSample(hh, s); } else { const p = toENZ(h.point); inspect(`<dl><dt>Object</dt><dd>Topography</dd><dt>E / N</dt><dd>${fmt(p.e, 1)} / ${fmt(p.n, 1)}</dd><dt>RL</dt><dd>${fmt(p.z, 2)} m</dd><dt>${S.lang === 'ar' ? 'قاع الحفرة هنا' : 'Pit floor here'}</dt><dd>${fmt(Math.min(pitFloor(p.e, p.n, S.pit), p.z), 1)} m</dd></dl>`); }
  });
}

function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); renderLabels(); drawGizmo(); }

// ---------------------------------------------------------------- boot
function boot() {
  if (!window.THREE || !THREE.OrbitControls) { $('#loading').textContent = 'Three.js failed to load — check your connection.'; return; }
  initScene(); bindLayerTree(); bindPointer(); applyLang();
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { curTab = b.dataset.tab; renderRibbon(); } });
  $('#tools').addEventListener('click', e => { const b = e.target.closest('[data-tool]'); if (b) onTool(b.dataset.tool); });
  $('#langBtn').onclick = () => { S.lang = S.lang === 'en' ? 'ar' : 'en'; applyLang(); };
  $('#cog').addEventListener('input', e => { S.cutoff = +e.target.value; filterBlocks(); renderLegend(); updateKPIs(); });
  $('#cog').addEventListener('change', () => { renderCards(); colorDrillholes(); });
  [['#inPrice', 'price'], ['#inMine', 'mineCost'], ['#inProc', 'procCost'], ['#inRec', 'recovery']].forEach(([id, k]) => $(id).addEventListener('change', e => { const v = parseFloat(e.target.value); if (isFinite(v) && v > 0) { S[k] = v; updateKPIs(); renderCards(); } }));
  $('#slOn').onchange = e => { S.slice.enabled = e.target.checked; applySlice(); };
  $('#slPos').oninput = e => { S.slice.pos = +e.target.value; applySlice(); };
  $('#slAxis').onclick = e => { const b = e.target.closest('[data-ax]'); if (!b) return; S.slice.axis = b.dataset.ax; S.slice.pos = b.dataset.ax === 'z' ? 230 : 300; applySlice(); };
  $('#cards').addEventListener('click', e => { const b = e.target.closest('[data-card]'); if (b && CARDS[+b.dataset.card] && CARDS[+b.dataset.card].run) CARDS[+b.dataset.card].run(); });
  $('#reportBtn').onclick = () => { const ar = S.lang === 'ar'; const args = { project_name: 'Wadi Gold Project', include_sensitivity: true }; addMsg('bot', callHTML('generate_executive_report', args) + (ar ? 'تم فتح التقرير التنفيذي.' : 'Executive report opened.')); dispatch('generate_executive_report', args, 'agent'); };
  $('#composer').addEventListener('submit', e => { e.preventDefault(); handlePrompt($('#prompt').value); $('#prompt').value = ''; });
  $('#prompt').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#composer').requestSubmit(); } });
  $('#suggest').addEventListener('click', e => { const b = e.target.closest('.sg'); if (b) handlePrompt(b.textContent); });
  $('#modalClose').onclick = closeModal; $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
  $('#csvFile').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const n = importCSV(rd.result); botSay(S.lang === 'ar' ? `<b>تم الاستيراد</b>: ${n} بئر. أُعيد تقدير نموذج البلوكات وتحسين الحفرة.` : `<b>Imported</b> ${n} drillholes. Block model re-estimated and pit re-optimised.`); } catch (err) { toast(err.message); } }; rd.readAsText(f); e.target.value = ''; });
  setTimeout(() => {
    makeHoles(); buildDrillholes(); rebuildModel(); applySlice(); renderDB(); $('#loading').hidden = true;
    const ar = S.lang === 'ar';
    botSay(ar ? `تم تحميل مشروع <b>وادي الذهب</b>: ${HOLES.length} بئراً، ${fmt(BM.nSamples)} تحليلاً، ${fmt(BM.N)} بلوكاً مقدَّراً بحجم ${BM.bs} م. رصد المدقق الذكي ${CARDS.filter(c => !c.done).length} ملاحظات أعلاه. اكتب أمراً بالعربية أو الإنجليزية، وسيتحول كل أمر إلى استدعاء أداة JSON يغيّر المشهد والمؤشرات.` : `Project <b>Wadi Gold</b> loaded: ${HOLES.length} drillholes, ${fmt(BM.nSamples)} assays, ${fmt(BM.N)} estimated ${BM.bs} m blocks. The AI auditor raised ${CARDS.filter(c => !c.done).length} items above. Type a command in English or Arabic — each one becomes a JSON tool call that changes the scene and KPIs.`);
    loop();
  }, 30);
}
icons(); boot();
</script>
